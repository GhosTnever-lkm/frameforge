[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameforge"
version = "1.18.1"
description = "Local-first, reversible Windows game tuning studio"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GhosTnever" }]
dependencies = ["PySide6-Essentials>=6.10,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
frameforge = "frameforge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frameforge = ["assets/*.png", "assets/*.ico"]
