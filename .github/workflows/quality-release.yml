name: Quality and Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - shell: pwsh
        run: ./build_windows.ps1
      - shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "dist/FrameForge-$version-windows-x64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "frameforge-archive-smoke"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $executable = Join-Path $extract "FrameForge/FrameForge.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "The release archive does not contain FrameForge.exe at the expected path."
          }
          $process = Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "FrameForge exited during startup (code $($process.ExitCode))."
              }
            } while (-not $process.MainWindowTitle -and (Get-Date) -lt $deadline)
            if ($process.MainWindowTitle -ne "FrameForge — Game Tuning Studio") {
              throw "FrameForge window did not become ready. Current title: '$($process.MainWindowTitle)'"
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: FrameForge-windows
          path: |
            dist/FrameForge-*.zip
            dist/FrameForge-*.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FrameForge-windows
          path: dist
      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/FrameForge-*.zip
            dist/FrameForge-*.zip.sha256
